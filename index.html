<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a8a8a8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="voice" />
    <meta
      name="description"
      content="voice | live note detection"
    />
    <title>voice | live note detection</title>
  </head>
  <body>
    <div id="app">
      <main class="stage">
        <section class="detector" aria-live="polite">
          <div class="capture-bar">
            <img class="brand-mark" src="/logo.svg" alt="voice">

            <p class="karaoke-status" id="karaokeStatus" role="status"></p>
            <label class="karaoke-upload" id="karaokeUpload">
              <input type="file" id="karaokeFile" accept="audio/mpeg,audio/mp3,.mp3" disabled>
              <span id="karaokeUploadLabel">load vocal sample</span>
            </label>

            <label class="monitor-control" title="monitor audio">
              <input type="checkbox" id="monitorInput" role="switch" aria-label="Monitor microphone input">
              <svg class="monitor-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
                <path stroke="currentColor" d="M3 7.5h1.5v5H3A1.5 1.5 0 0 1 1.5 11V9A1.5 1.5 0 0 1 3 7.5ZM3.5 7v-.5a4 4 0 0 1 4-4M12 7.5h-1.5v5H12a1.5 1.5 0 0 0 1.5-1.5V9A1.5 1.5 0 0 0 12 7.5ZM11.5 7v-.5a4 4 0 0 0-4-4"/>
              </svg>
            </label>

            <div class="listen-controls">
              <label class="input-source">
                <span class="visually-hidden">Input source</span>
                <select id="inputSource" aria-label="Input source">
                  <option value="">Default input</option>
                </select>
              </label>
              <div class="mic-gain-control" id="micGainControl">
                <button
                  type="button"
                  class="mic-gain-button"
                  id="micGainButton"
                  aria-label="Microphone boost"
                  aria-controls="micGainPopover"
                  aria-expanded="false"
                  title="Microphone boost"
                >
                  <span id="micGainButtonValue">+0</span>
                </button>
                <div class="mic-gain-popover" id="micGainPopover" hidden>
                  <output id="micGainValue" for="micGain">0 dB</output>
                  <input type="range" id="micGain" min="0" max="24" step="1" value="0" aria-label="Microphone boost in decibels">
                </div>
              </div>
              <button type="button" class="listen" id="listenBtn" disabled>
                <span class="listen-dot" aria-hidden="true"></span>
                <span id="listenLabel">Loading F0 model…</span>
              </button>
              <div class="level" aria-hidden="true">
                <div class="level-fill" id="levelFill"></div>
              </div>
            </div>

          </div>

          <div class="scope device">
            <div class="transport" id="transport" hidden>
              <button type="button" id="playBtn" class="transport-play">
                <span class="transport-glyph" id="playGlyph" aria-hidden="true"></span>
                <span id="playLabel">Play</span>
              </button>
              <button type="button" id="backBtn" class="transport-button" title="Go back 5 seconds">−5 sec</button>
              <span class="transport-time" id="transportTime">0:00.0 / 0:00.0</span>
              <div class="zoom-controls" aria-label="Timeline zoom">
                <button type="button" id="zoomOutBtn" class="transport-button zoom-button" title="Zoom out" aria-label="Zoom out">−</button>
                <span id="zoomLevel" class="zoom-level">100%</span>
                <button type="button" id="zoomInBtn" class="transport-button zoom-button" title="Zoom in" aria-label="Zoom in">+</button>
              </div>
              <span class="transport-mode" id="transportMode"></span>
              <div class="karaoke-audio-controls" id="karaokeAudioControls" aria-label="Karaoke playback sources" hidden>
                <label title="Use headphones to prevent feedback">
                  <input type="checkbox" id="karaokeMicPlayback">
                  My playback
                </label>
                <label>
                  <input type="checkbox" id="karaokeSongPlayback" checked>
                  Song MP3
                </label>
              </div>
              <a id="recordingDownload" class="transport-link" download>Download</a>
              <button type="button" id="closeTakeBtn" class="transport-close">
                <svg class="transport-exit-icon" width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M3 1C2.44772 1 2 1.44772 2 2V13C2 13.5523 2.44772 14 3 14H8C8.55228 14 9 13.5523 9 13V9.5C9 9.22386 8.77614 9 8.5 9C8.22386 9 8 9.22386 8 9.5V13H3V2H8V5.5C8 5.77614 8.22386 6 8.5 6C8.77614 6 9 5.77614 9 5.5V2C9 1.44772 8.55228 1 8 1H3ZM11.1464 4.14645C11.3417 3.95118 11.6583 3.95118 11.8536 4.14645L14.8536 7.14645C15.0488 7.34171 15.0488 7.65829 14.8536 7.85355L11.8536 10.8536C11.6583 11.0488 11.3417 11.0488 11.1464 10.8536C10.9512 10.6583 10.9512 10.3417 11.1464 10.1464L13.2929 8H6.5C6.22386 8 6 7.77614 6 7.5C6 7.22386 6.22386 7 6.5 7H13.2929L11.1464 4.85355C10.9512 4.65829 10.9512 4.34171 11.1464 4.14645Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"/>
                </svg>
                <span id="closeTakeLabel">Back to live</span>
              </button>
            </div>
            <canvas id="trail" class="trail" width="1200" height="320"></canvas>
          </div>

          <div class="note-panel device">
            <div class="note-display" id="noteDisplay">
              <span class="note-name" id="noteName">—</span>
              <span class="note-meta">
                <span id="noteHz">— Hz</span>
                <span class="dot" aria-hidden="true"></span>
                <span id="noteConf">—%</span>
              </span>
            </div>

            <div class="cents" aria-label="Tuning cents">
              <span class="control-label">Tune</span>
              <div class="cents-track">
                <div class="cents-marks" aria-hidden="true">
                  <span>-50</span>
                  <span>0</span>
                  <span>+50</span>
                </div>
                <div class="cents-center" aria-hidden="true"></div>
                <div class="cents-needle" id="centsNeedle"></div>
              </div>
              <p class="cents-value" id="centsValue">0 ¢</p>
            </div>

          </div>

          <section class="instrument" aria-label="Playable synthesizer keyboard">
            <div id="keyboard" class="keyboard-wrap"></div>
            <div class="instrument-controls device">
              <p class="target-status" id="targetStatus"></p>
              <div class="instrument-credit">
                <p>
                  <a href="https://github.com/lars76/swift-f0/">voice detection using SwiftF0 by Lars Nieradzik</a>
                </p>
              </div>
              <div class="instrument-footer">
                <p class="keyboard-help"><kbd>Z</kbd>/<kbd>X</kbd> octave</p>
                <p class="record-status" id="recordStatus"></p>
                <div class="instrument-settings">
                  <div class="scale-control" role="group" aria-label="Scale">
                    <select id="scaleRoot" aria-label="Scale root" disabled>
                      <option value="0">C</option>
                      <option value="1">C♯</option>
                      <option value="2">D</option>
                      <option value="3">D♯</option>
                      <option value="4">E</option>
                      <option value="5">F</option>
                      <option value="6">F♯</option>
                      <option value="7">G</option>
                      <option value="8">G♯</option>
                      <option value="9">A</option>
                      <option value="10">A♯</option>
                      <option value="11">B</option>
                    </select>
                    <select id="scaleType" aria-label="Scale type">
                      <option value="">No scale</option>
                      <option value="major">Major</option>
                      <option value="dorian">Dorian</option>
                      <option value="phrygian">Phrygian</option>
                      <option value="lydian">Lydian</option>
                      <option value="mixolydian">Mixolydian</option>
                      <option value="naturalMinor">Natural minor</option>
                      <option value="locrian">Locrian</option>
                      <option value="harmonicMinor">Harmonic minor</option>
                      <option value="majorPentatonic">Major pentatonic</option>
                      <option value="minorPentatonic">Minor pentatonic</option>
                    </select>
                  </div>
                  <label class="hold-control">
                    Hold
                    <input type="number" id="holdSeconds" min="0.5" max="10" step="0.5" value="2" aria-label="Seconds to hold target note">
                    sec
                  </label>
                  <label class="target-feedback-control" title="target completion feedback">
                    <input type="checkbox" id="targetFeedbackInput" role="switch" aria-label="Target completion feedback" checked>
                    <svg class="target-feedback-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
                      <path d="M7.5 0C7.77614 0 8 0.223858 8 0.5V1.80762C10.6919 2.09438 12.8147 4.28034 13.0049 7H14.5C14.7761 7 15 7.22386 15 7.5C15 7.77614 14.7761 8 14.5 8H12.9873C12.7077 10.624 10.624 12.7077 8 12.9873V14.5C8 14.7761 7.77614 15 7.5 15C7.22386 15 7 14.7761 7 14.5V13.0039C4.28041 12.8137 2.09539 10.6919 1.80859 8H0.5C0.223858 8 0 7.77614 0 7.5C0 7.22386 0.223858 7 0.5 7H1.79102C1.98595 4.21179 4.21179 1.98595 7 1.79102V0.5C7 0.223858 7.22386 0 7.5 0ZM7 2.74219C4.73667 2.93307 2.93409 4.73668 2.74316 7H5.5C5.77614 7 6 7.22386 6 7.5C6 7.77614 5.77614 8 5.5 8H2.76465C3.0437 10.1665 4.8054 11.8667 7 12.0518V9.5C7 9.22386 7.22386 9 7.5 9C7.77614 9 8 9.22386 8 9.5V12.0303C10.0987 11.76 11.76 10.0987 12.0303 8H9.5C9.22386 8 9 7.77614 9 7.5C9 7.22386 9.22386 7 9.5 7H12.0518C11.8667 4.8054 10.1665 3.0437 8 2.76465V5.5C8 5.77614 7.77614 6 7.5 6C7.22386 6 7 5.77614 7 5.5V2.74219Z" fill="currentColor"/>
                    </svg>
                  </label>
                  <div class="octave-control">
                    <button type="button" id="octaveDown" aria-label="Octave down">
                      <svg class="octave-icon" width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M12.25 7C12.5261 7 12.75 7.22386 12.75 7.5C12.75 7.77614 12.5261 8 12.25 8H2.75C2.47386 8 2.25 7.77614 2.25 7.5C2.25 7.22386 2.47386 7 2.75 7H12.25Z" fill="currentColor"/>
                      </svg>
                    </button>
                    <span>Oct <strong id="octaveValue">3</strong></span>
                    <button type="button" id="octaveUp" aria-label="Octave up">
                      <svg class="octave-icon" width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M7.5 2.25C7.77614 2.25 8 2.47386 8 2.75V7H12.25C12.5261 7 12.75 7.22386 12.75 7.5C12.75 7.77614 12.5261 8 12.25 8H8V12.25C8 12.5261 7.77614 12.75 7.5 12.75C7.22386 12.75 7 12.5261 7 12.25V8H2.75C2.47386 8 2.25 7.77614 2.25 7.5C2.25 7.22386 2.47386 7 2.75 7H7V2.75C7 2.47386 7.22386 2.25 7.5 2.25Z" fill="currentColor"/>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
