<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="voicetool | live note detection"
    />
    <title>voicetool | live note detection</title>
  </head>
  <body>
    <div id="app">
      <main class="stage">
        <section class="detector" aria-live="polite">
          <div class="scope device">
            <div class="transport" id="transport" hidden>
              <button type="button" id="playBtn" class="transport-play">
                <span class="transport-glyph" id="playGlyph" aria-hidden="true"></span>
                <span id="playLabel">Play</span>
              </button>
              <span class="transport-time" id="transportTime">0:00.0 / 0:00.0</span>
              <a id="recordingDownload" class="transport-link" download>Download</a>
              <button type="button" id="closeTakeBtn" class="transport-close">Back to live</button>
            </div>
            <canvas id="trail" class="trail" width="1200" height="320"></canvas>
          </div>

          <div class="harmonics device">
            <canvas id="harmonicTrail" class="harmonic-trail" width="1200" height="180"></canvas>
          </div>

          <div class="note-panel device">
            <div class="note-display" id="noteDisplay">
              <span class="note-name" id="noteName">—</span>
              <span class="note-meta">
                <span id="noteHz">— Hz</span>
                <span class="dot" aria-hidden="true"></span>
                <span id="noteConf">—%</span>
              </span>
            </div>

            <div class="cents" aria-label="Tuning cents">
              <span class="control-label">Tune</span>
              <div class="cents-track">
                <div class="cents-marks" aria-hidden="true">
                  <span>-50</span>
                  <span>0</span>
                  <span>+50</span>
                </div>
                <div class="cents-center" aria-hidden="true"></div>
                <div class="cents-needle" id="centsNeedle"></div>
              </div>
              <p class="cents-value" id="centsValue">0 ¢</p>
            </div>

            <div class="level-block">
              <span class="control-label">Input level</span>
              <div class="level" aria-hidden="true">
                <div class="level-fill" id="levelFill"></div>
              </div>
            </div>

            <button type="button" class="listen" id="listenBtn" disabled>
              <span class="listen-dot" aria-hidden="true"></span>
              <span id="listenLabel">Loading F0 model…</span>
            </button>
          </div>

          <section class="instrument" aria-label="Playable synthesizer keyboard">
            <div id="keyboard" class="keyboard-wrap"></div>
            <div class="instrument-controls device">
              <p class="target-status" id="targetStatus"></p>
              <div class="instrument-credit">
                <p>voicetool by <a href="https://malte.ws">malte</a></p>
                <p>
                  <a href="https://github.com/lars76/swift-f0/">voice detection using SwiftF0 by Lars Nieradzik</a>
                </p>
              </div>
              <div class="instrument-footer">
                <p class="keyboard-help"><kbd>Z</kbd>/<kbd>X</kbd> octave</p>
                <p class="record-status" id="recordStatus"></p>
                <div class="instrument-settings">
                  <label class="monitor-control" title="Use headphones to prevent feedback">
                    <input type="checkbox" id="monitorInput">
                    Monitor input
                  </label>
                  <label class="hold-control">
                    Hold
                    <input type="number" id="holdSeconds" min="0.5" max="10" step="0.5" value="2" aria-label="Seconds to hold target note">
                    sec
                  </label>
                  <div class="octave-control">
                    <button type="button" id="octaveDown" aria-label="Octave down">−</button>
                    <span>Oct <strong id="octaveValue">3</strong></span>
                    <button type="button" id="octaveUp" aria-label="Octave up">+</button>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
